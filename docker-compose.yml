version: '3.8'

services:
  # ============================================
  # 体育彩票数据采集服务
  # ============================================
  zqgetdata:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zqgetdata_collector
    restart: unless-stopped
    
    # 依赖检查（确保 MySQL 容器已启动）
    depends_on:
      mysql:
        condition: service_healthy
    
    # 挂载卷配置
    volumes:
      # 日志持久化（建议挂载到宿主机）
      - ./app/log:/app/app/log
      # 如果需要持久化其他数据，可以添加更多挂载点
    
    # 环境变量配置（请根据实际情况修改）
    environment:
      # 时区设置
      - TZ=Asia/Shanghai
      
      # ==========================================
      # 数据库配置（请修改为您的实际配置）
      # ==========================================
      - DB_HOST=mysql          # MySQL 容器名或外部地址
      - DB_PORT=3306
      - DB_USER=root           # 数据库用户名
      - DB_PASSWORD=your_password  # 数据库密码（请修改）
      - DB_NAME=soccer_data    # 数据库名称
    
    # 网络配置
    networks:
      - zqgetdata-network
    
    # 端口映射（API 服务，如不需要可注释）
    # ports:
    #   - "8000:8000"
    
    # 资源限制（根据服务器配置调整）
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"    # 单个日志文件最大 10MB
        max-file: "3"      # 保留 3 个日志文件
    
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # MySQL 数据库服务（可选）
  # 如果使用外部 MySQL，可以删除此服务
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: zqgetdata_mysql
    restart: unless-stopped
    
    # 环境变量
    environment:
      MYSQL_ROOT_PASSWORD: your_password  # root 密码（请修改）
      MYSQL_DATABASE: soccer_data         # 自动创建的数据库
      MYSQL_USER: soccer_user             # 普通用户
      MYSQL_PASSWORD: user_password       # 普通用户密码（请修改）
      TZ: Asia/Shanghai
    
    # 端口映射（可选，如需外部访问则开启）
    # ports:
    #   - "3306:3306"
    
    # 数据持久化
    volumes:
      - mysql-data:/var/lib/mysql
      # 自定义配置文件（可选）
      # - ./mysql/conf.d:/etc/mysql/conf.d
    
    # 网络配置
    networks:
      - zqgetdata-network
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # 健康检查
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # 命令配置（优化 MySQL 性能）
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --wait-timeout=28800
      --interactive-timeout=28800

# ============================================
# 网络配置
# ============================================
networks:
  zqgetdata-network:
    driver: bridge

# ============================================
# 数据卷配置
# ============================================
volumes:
  mysql-data:
    driver: local
